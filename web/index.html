<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WebRTC Audio</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h1>ESP32 real-time WebRTC Audio terminal</h1>
    
    <div>
        <button id="startBtn">Start Connection</button>
        <button id="stopBtn" disabled>Stop Connection</button>
    </div>

    <!-- hidden audio label，play the audio from server -->
    <audio id="remoteAudio" autoplay></audio>

    <div id="status">status: unconnected</div>

    <script src="app.js"></script>
</body>
</html>
